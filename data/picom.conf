#
# Vesper - picom: il compositor che Vesper avvia SOLO con le famiglie di temi
# con angoli arrotondati (macOS chiaro/scuro, Cards) o con lo stile finestre
# "vetro reale". Lo avvia e lo ferma vesper.profiles.model (_manage_picom),
# sempre con --config su QUESTO file: il ~/.config/picom.conf dell'utente non
# viene mai letto ne' toccato. Una copia personale si puo' mettere in
# ~/.config/vesper/picom.conf.
#
# Backend GLX e basta: picom parte solo con una scheda video vera con driver
# 3D (i915/xe/amdgpu/radeon/nouveau). Nelle VM e con OpenGL software rendeva
# le finestre bianche (VirtualBox) o nere quelle col motore web (QEMU).
backend = "glx";
vsync = true;
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'"
];

# Ombra morbida stile macOS.
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.35;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

# Sfocatura "vetro smerigliato" per lo stile finestre "vetro reale": sfoca
# cio' che sta DIETRO le parti traslucide; le finestre opache non cambiano.
# Kernel gaussiano: e' quello che ogni backend e versione di picom supporta.
blur-method = "kernel";
blur-kern = "11x11gaussian";
blur-background = true;
blur-background-frame = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
